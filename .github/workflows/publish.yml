# Publishes upliftlab to PyPI when a version tag (v0.26.1, …) is pushed. It uses PyPI trusted publishing, so no token is stored
# here: PyPI trusts this workflow in this repository, under the `pypi` environment.
name: Publish to PyPI

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest tests/test_engine.py -q
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir pkg
          python -m twine check --strict pkg/*
      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: pkg/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/upliftlab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg
          path: pkg/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pkg/
