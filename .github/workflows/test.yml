# Runs the engine tests on every push to main and every pull request, on the oldest and newest supported Python.
# Linux x86_64 has EconML wheels, so this covers the EconML built-ins; the ARM and browser path (scikit-learn lite) is the
# same code with EconML absent, which the tests also exercise.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest tests/test_engine.py -q
