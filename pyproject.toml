[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "upliftlab"
version = "0.23.0"
description = "Find the uplift model that gives the most incremental outcome for the same budget, on your own experiment data"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "web/fonts/LICENSE", "web/vendor/LICENSES.txt"]
keywords = ["uplift modeling", "causal inference", "CATE", "targeting", "marketing", "A/B testing"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering"]
# The engine needs only NumPy. The built-in algorithms use scikit-learn. Your own algorithms can use anything you install.
dependencies = ["numpy>=1.21", "scikit-learn>=1.2"]

[project.optional-dependencies]
gpu = ["torch"]
templates = ["lightgbm>=4", "torch"]
dev = ["pytest", "lightgbm>=4"]

[project.urls]
Homepage = "https://uplift-lab.vercel.app"
Source = "https://github.com/Funbucket/upliftlab"

[project.scripts]
upliftlab = "upliftlab.__main__:main"

# The Python engine lives in engine/upliftlab. The web UI in web/ ships inside the package as upliftlab/ui, as is (no build
# step), so `pip install git+https://github.com/Funbucket/upliftlab` gives the same screen as the website.
[tool.setuptools]
packages = ["upliftlab", "upliftlab.algorithms", "upliftlab.ui"]

[tool.setuptools.package-dir]
upliftlab = "engine/upliftlab"
"upliftlab.ui" = "web"

[tool.setuptools.package-data]
upliftlab = ["templates/*.py"]
"upliftlab.ui" = ["*.html", "*.css", "*.js", "views/*.js", "fonts/*.css", "fonts/LICENSE", "fonts/files/*.woff2", "vendor/*"]
